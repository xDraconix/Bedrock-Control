<VirtualHost *:8088>
 ServerName localhost
 DocumentRoot /opt/bedrock-control-pro/public
 <Directory /opt/bedrock-control-pro/public>
  Require all granted
  AllowOverride None
  Options -Indexes -MultiViews
 </Directory>
 ErrorLog ${APACHE_LOG_DIR}/bedrock-panel-error.log
 CustomLog ${APACHE_LOG_DIR}/bedrock-panel-access.log combined
</VirtualHost>
